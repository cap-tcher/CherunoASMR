[project]
name = "cheruno-audio"
version = "0.1.0"
description = "CherunoASMR 本機音訊服務：TTS 引擎轉呼叫、讀み替換（之後：混音、雙耳定位）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "numpy>=2.0",
    "soundfile>=0.12",
    "anthropic>=2.10.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
cheruno-audio = "cheruno_audio.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cheruno_audio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
